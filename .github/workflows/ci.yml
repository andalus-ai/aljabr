name: Aljabr CI

on:
  pull_request:
    paths:
      - "core/**"
      - "backend/**"
      - "models/**"
      - "buildSrc/**"
      - "gradle/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "core/**"
      - "backend/**"
      - "models/**"
      - "buildSrc/**"
      - "gradle/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout aljabr
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # The default CI validates Aljabr using the checked-in FFM bindings
      # (src/main/java/tech/kayys/aljabr/llama/*.java). No jextract or llama.cpp
      # checkout is required for the default build; native binding regeneration
      # is opt-in via -PwithLlamaFfmBindings=true.

      # The default CI validates Aljabr without the optional Tafkir integration.
      # Cross-project quantizer integration is validated separately with -PwithTafkir=true.

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aljabr-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            aljabr-gradle-
      # ─────────────────────────────────────────────────────────────────────

      - name: Build and Test (CPU)
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3G
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --info test -x :backend:metal:aljabr-backend-metal:test

      # Preserve JUnit XML and HTML reports when a test worker crashes or cannot
      # execute a test class; these are needed to diagnose failures beyond Gradle's summary.
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aljabr-test-diagnostics
          if-no-files-found: warn
          path: |
            **/build/test-results/test/**
            **/build/reports/tests/test/**
            build/reports/problems/**

  publish-snapshot:
    name: Publish Snapshot to Maven Local
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout aljabr
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Publish Snapshot to Maven Local
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3G
        run: |
          set -euo pipefail
          ./gradlew --no-daemon publishToMavenLocal -x test
