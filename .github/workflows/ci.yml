name: Aljabr CI

on:
  pull_request:
    paths:
      - "core/**"
      - "backend/**"
      - "models/**"
      - "buildSrc/**"
      - "gradle/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "core/**"
      - "backend/**"
      - "models/**"
      - "buildSrc/**"
      - "gradle/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout aljabr
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Generate the FFM header class referenced by the checked-in llama.cpp wrappers.
      # Keep the tool and native headers in the runner temp directory; neither is committed.
      - name: Install jextract and prepare llama.cpp headers
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/jextract.tar.gz"
          install_dir="$RUNNER_TEMP/jextract"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 \
            "https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$install_dir"
          jextract_bin="$(find "$install_dir" -type f -path '*/bin/jextract' -print -quit)"
          if [ -z "$jextract_bin" ]; then
            echo "ERROR: jextract executable was not found in the downloaded archive"
            find "$install_dir" -maxdepth 4 -type f | head -80
            exit 1
          fi
          chmod +x "$jextract_bin"
          echo "JEXTRACT=$jextract_bin" >> "$GITHUB_ENV"
          llama_dir="$RUNNER_TEMP/llama.cpp"
          git clone --depth 1 https://github.com/bhangun/llama.cpp.git "$llama_dir"
          test -f "$llama_dir/include/llama.h"
          echo "LLAMA_CPP_INCLUDE=$llama_dir/include" >> "$GITHUB_ENV"
          echo "GGML_INCLUDE=$llama_dir/ggml/include" >> "$GITHUB_ENV"
          "$jextract_bin" --version

      # The default CI validates Aljabr without the optional Tafkir integration.
      # Cross-project quantizer integration is validated separately with -PwithTafkir=true.

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aljabr-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            aljabr-gradle-
      # ─────────────────────────────────────────────────────────────────────

      - name: Build and Test (CPU)
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3G
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -PwithLlamaFfmBindings=true test -x :backend:metal:aljabr-backend-metal:test

  publish-snapshot:
    name: Publish Snapshot to Maven Local
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout aljabr
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Publish Snapshot to Maven Local
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3G
        run: |
          set -euo pipefail
          ./gradlew --no-daemon publishToMavenLocal -x test
