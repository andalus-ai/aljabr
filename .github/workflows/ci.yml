name: Aljabr CI

on:
  pull_request:
    paths:
      - "core/**"
      - "backend/**"
      - "models/**"
      - "buildSrc/**"
      - "gradle/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "core/**"
      - "backend/**"
      - "models/**"
      - "buildSrc/**"
      - "gradle/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout aljabr
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # ── Tafkir composite build bootstrap ─────────────────────────────────
      # aljabr-safetensor-quantization depends on tech.kayys.tafkir:*
      # SNAPSHOT artifacts. When tafkir is checked out as a sibling directory,
      # settings.gradle.kts includes it as a composite build and Gradle
      # substitutes the Maven coordinates with source-project dependencies —
      # no binary SNAPSHOT resolution needed.
      - name: Checkout tafkir (quantizer composite build)
        uses: actions/checkout@v4
        with:
          repository: bhangun/tafkir
          path: ../tafkir
          ref: main

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aljabr-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            aljabr-gradle-
      # ─────────────────────────────────────────────────────────────────────

      - name: Build and Test (CPU)
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3G
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace test -x :backend:metal:aljabr-backend-metal:test

  publish-snapshot:
    name: Publish Snapshot to Maven Local
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout aljabr
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Checkout tafkir (quantizer composite build)
        uses: actions/checkout@v4
        with:
          repository: bhangun/tafkir
          path: ../tafkir
          ref: main

      - name: Publish to Maven Local
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3G
        run: |
          set -euo pipefail
          ./gradlew --no-daemon publishToMavenLocal -x test
