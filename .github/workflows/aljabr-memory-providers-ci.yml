name: Aljabr Memory Providers CI

on:
  pull_request:
    paths:
      - "core/aljabr-core/**"
      - "core/aljabr-offheap/**"
      - "core/aljabr-helixdb/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/aljabr-memory-providers-ci.yml"
  push:
    branches: [main]
    paths:
      - "core/aljabr-core/**"
      - "core/aljabr-offheap/**"
      - "core/aljabr-helixdb/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/aljabr-memory-providers-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-providers:
    name: Off-heap and legacy memory providers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test canonical and compatibility providers
        run: ./gradlew --no-daemon --stacktrace -PwithOffHeapStore=true -PwithHelixDb=true :core:aljabr-offheap:test :core:aljabr-helixdb:test
