name: Aljabr Core CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.java"
      - "**/*.kt"
      - "**/*.kts"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - ".github/workflows/aljabr-core-ci.yml"
  pull_request:
    paths:
      - "**/*.java"
      - "**/*.kt"
      - "**/*.kts"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - ".github/workflows/aljabr-core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aljabr-core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tensor-and-cpu:
    name: Tensor contracts and CPU backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run tensor and CPU backend tests
        run: ./gradlew --no-daemon --stacktrace :core:aljabr-tensor:test :backend:cpu:aljabr-backend-cpu:test
